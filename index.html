<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Недельный отчет - Конверсия</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    .btn {
      display: inline-block;
      padding: 20px 40px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .info {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Журнал конверсии</h1>
    <p>Нажмите кнопку ниже чтобы заполнить недельный отчет</p>
    <button class="btn" onclick="openReport()">Открыть отчет</button>
    <div class="info">
      <p>Заполните данные за неделю: чеки и показания счетчика</p>
    </div>
  </div>

  <script>
    function openReport() {
      // Добавляем ?authuser=0 чтобы избежать проблемы с /u/1/
      var url = "https://script.google.com/macros/s/AKfycbyBt1zAnp7jHqfmucZCWX9OgqZn75eeNFOlkcvVz5PCCkuHgUTlUb0-PEb6KbsxbDza/exec";
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
